<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // Apply the saved navigation preference before first paint, so a reader who hid the
      // sidebar never sees it flash back on reload. The studio re-applies the same class from
      // the same key when it hydrates; see src/lib/ui/preferences.ts.
      try {
        if (localStorage.getItem('fractal.sidebarCollapsed') === 'true')
          document.querySelector('.studio')?.classList.add('sidebar-collapsed');
        const navHeight = Number(localStorage.getItem('fractal.panelHeight.navigation'));
        if (navHeight >= 160) {
          const nav = document.getElementById('fractal-sidebar');
          nav?.style.setProperty('--panel-height', `${navHeight}px`);
          nav?.classList.add('panel-sized');
        }
        const sidebarWidth = Number(localStorage.getItem('fractal.sidebarWidth'));
        if (sidebarWidth >= 180 && sidebarWidth <= 360)
          document
            .querySelector('.studio')
            ?.style.setProperty('--sidebar-width', `${sidebarWidth}px`);
      } catch {
        /* Storage is optional. */
      }
    </script>
  </body>
</html>
